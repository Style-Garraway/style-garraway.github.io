<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Fond de secours : il est peint avant le chargement de style.css, pour
       empêcher tout flash blanc lors d'une navigation complète. -->
  <style>
    html { background: #F2F6F5; color-scheme: light; }
    html[data-theme="nuit"] { background: #0A1A22; color-scheme: dark; }
    @media (prefers-color-scheme: dark) {
      html:not([data-theme="jour"]) { background: #0A1A22; color-scheme: dark; }
    }
  </style>
  <!-- ======================================================================
       A LIRE AVANT DE TOUCHER : ce script doit rester ICI, en haut du <head>.
       ----------------------------------------------------------------------
       Il applique le theme (jour ou nuit) AVANT la premiere peinture de la
       page. S'il etait plus bas, ou dans app.js, le navigateur afficherait
       d'abord la palette claire par defaut : un visiteur en mode nuit verrait
       un eclair blanc a chaque changement de page.

       Il est volontairement ecrit en dur et non dans un fichier separe : un
       fichier externe serait telecharge trop tard.
       ====================================================================== -->
  <script>
    try {
      var t = localStorage.getItem("sg-theme");
      if (t === "jour" || t === "nuit") {
        document.documentElement.setAttribute("data-theme", t);
      }
    } catch (e) { /* navigation privee : on laisse le systeme decider */ }

    /* LES TRANSITIONS ENTRE PAGES N'EXISTENT PAS PARTOUT.
       Firefox gere la propriete view-transition-name, mais PAS encore les
       transitions d'une page a l'autre. Tester la propriete en CSS donnait
       donc un faux positif : le repli ne se declenchait jamais et Firefox
       n'affichait aucune animation.

       On teste ici l'evenement "pagereveal", qui n'existe QUE dans les
       navigateurs sachant faire ces transitions. Si absent, on pose une
       classe que le CSS utilise pour jouer une animation d'arrivee. */
    if (!("onpagereveal" in window)) {
      document.documentElement.className += " sans-transition-de-page";
    }
  </script>


  <title>Page introuvable — Style Garraway</title>
  <meta name="description" content="Cette page n'existe pas.">
  <meta name="robots" content="noindex">

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body data-page="404">

  <noscript>
    <p class="sans-js">
      Cette page n'existe pas. <a href="index.html">Retour à l'accueil</a>.
    </p>
  </noscript>

  <div class="page">

    <div class="fil" aria-hidden="true"><span class="fil__signal"></span></div>

    <main id="contenu">
      <section class="hero" id="erreur" style="min-height:60vh">

        <p class="hero__statut">Erreur 404</p>

        <h1 class="hero__nom" style="font-size:clamp(2rem,7vw,3.25rem)">Le lien est rompu</h1>

        <p class="hero__poste">Cette page n'existe pas</p>

        <p class="hero__accroche">
          L'adresse demandée ne correspond à aucune page de ce site. Le lien
          était peut-être incomplet, ou la page a changé de nom.
        </p>

        <div class="hero__actions">
          <a class="bouton bouton--plein" href="index.html">Retour à l'accueil</a>
          <a class="bouton bouton--vide" href="certifications.html">Voir mes certifications</a>
        </div>

      </section>
    </main>
  </div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>

</body>
</html>
